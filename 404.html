<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>404 - Fichier introuvable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background: linear-gradient(135deg, #232526 0%, #414345 100%);
        color: #fff;
        font-family: "Segoe UI", "Arial", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
        padding: 40px 30px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 16px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      }
      h1 {
        font-size: 5em;
        margin: 0 0 10px 0;
        letter-spacing: 8px;
        color: #ff5252;
        text-shadow: 2px 2px 8px #000;
      }
      h2 {
        margin: 0 0 20px 0;
        font-weight: 400;
        color: #fff;
      }
      p {
        color: #ccc;
        margin-bottom: 30px;
      }
      a {
        color: #ff5252;
        text-decoration: none;
        font-weight: bold;
        border-bottom: 1px dashed #ff5252;
        transition: color 0.2s;
      }
      a:hover {
        color: #fff;
        border-bottom: 1px solid #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Fichier introuvable</h2>
      <p>
        Le fichier ou la ressource demandée n’existe pas sur ce CDN.<br />
        Vérifiez l’URL ou retournez à la page d’accueil.
      </p>
      <a href="/">Retour à l’accueil</a>
    </div>
  </body>
</html>
