<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>CDN Eminium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background: linear-gradient(120deg, #232526 0%, #485563 100%);
        color: #fff;
        font-family: "Segoe UI", "Arial", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: rgba(0, 0, 0, 0.7);
        border-radius: 18px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        padding: 48px 36px;
        text-align: center;
        max-width: 420px;
      }
      h1 {
        font-size: 3em;
        margin-bottom: 0.2em;
        letter-spacing: 2px;
        color: #ffb347;
        text-shadow: 2px 2px 8px #000;
      }
      h2 {
        font-weight: 400;
        color: #fff;
        margin-bottom: 1.2em;
      }
      p {
        color: #ccc;
        margin-bottom: 2em;
      }
      .logo {
        width: 80px;
        height: 80px;
        margin-bottom: 1em;
        border-radius: 16px;
        background: #fff3;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        margin-right: auto;
      }
      .logo img {
        width: 60px;
        height: 60px;
        object-fit: contain;
      }
      a {
        color: #ffb347;
        text-decoration: none;
        font-weight: bold;
        border-bottom: 1px dashed #ffb347;
        transition: color 0.2s;
      }
      a:hover {
        color: #fff;
        border-bottom: 1px solid #fff;
      }
      .footer {
        margin-top: 2em;
        color: #888;
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img
          src="https://eminium.ovh/storage/img/eminium-logo.png"
          alt="Logo Eminium"
        />
      </div>
      <h1>CDN Eminium</h1>
      <h2>Bienvenue sur le CDN officiel</h2>
      <p>
        Ce serveur héberge les ressources, mods et fichiers nécessaires au
        fonctionnement de l’écosystème Eminium.<br />
        Si vous êtes ici par erreur, retournez sur
        <a href="https://eminium.ovh">le site principal</a>.
      </p>
      <a href="/404.html">Voir la page 404 personnalisée</a>
    </div>
    <div class="footer">&copy; 2026 Eminium &mdash; Tous droits réservés</div>
  </body>
</html>
